# legacy/dock\er-compose.yml
# Старый (legacy) стек: Mattermost 9.5 + MySQL 8.0
name: mattermost

services:
  mattermost:
    image: mattermost/mattermost-team-edition:9.5
    container_name: mattermost
    ports:
      - "8065:8065"
    environment:
      - TZ=UTC
      - MM_SQLSETTINGS_DRIVERNAME=mysql
      - MM_SQLSETTINGS_DATASOURCE=root:${MYSQL_ROOT_PASSWORD}@tcp(mattermost-mysql:3306)/mattermost?charset=utf8mb4,utf8&writeTimeout=30s
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_TEAMSETTINGS_ENABLEOPENSERVER=false
    volumes:
      # Общий том с пользовательскими файлами (аватары, вложения) —
      # будет переиспользован в docker-compose.prod.yml
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    networks:
      - mattermost_network
    depends_on:
      mattermost-mysql:
        condition: service_healthy
    restart: unless-stopped

  mattermost-mysql:
    image: mysql:8.0
    container_name: mattermost-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=mattermost
      - MYSQL_USER=mmuser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mattermost_network
    restart: unless-stopped

networks:
  mattermost_network:
    name: mattermost_network
    driver: bridge

volumes:
  mattermost_data:
  mattermost_logs:
  mysql_data:
